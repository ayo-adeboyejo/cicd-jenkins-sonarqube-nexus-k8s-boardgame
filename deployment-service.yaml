apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardgame-deployment
  namespace: boardgame
spec:
  selector:
    matchLabels:
      app: boardgame
  replicas: 2
  template:
    metadata:
      labels:
        app: boardgame
    spec:
      # Disable automounting of service account token — fixes SonarQube
      # security warning about automounted service account credentials
      automountServiceAccountToken: false
      containers:
        - name: boardgame
          image: "aayodeji/boardgame:IMAGE_TAG"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Resource requests and limits — fixes SonarQube reliability warnings
          # requests: guaranteed minimum resources scheduled on the node
          # limits: maximum resources the container can use
          resources:
            requests:
              memory: "256Mi"   # minimum memory guaranteed
              cpu: "250m"       # minimum 0.25 CPU core guaranteed
              ephemeral-storage: "500Mi"  # minimum storage guaranteed
            limits:
              memory: "512Mi"   # container will be OOM killed if exceeded
              cpu: "500m"       # container will be throttled if exceeded
          # Security context — runs container as non-root matching Dockerfile USER
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: boardgame-svc
  namespace: boardgame
spec:
  selector:
    app: boardgame
  ports:
    - protocol: "TCP"
      port: 80
      targetPort: 8080
  type: LoadBalancer
